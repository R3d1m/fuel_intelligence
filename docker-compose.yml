services:
  simulator:
    image: asifmahmoud414/bup-fuel-supply-simulator:1.0.0
    container_name: fuel-simulator
    environment:
      SIMULATION_SPEED: ${SIMULATION_SPEED:-15}
      TICK_MINUTES: ${TICK_MINUTES:-8}
      SIMULATOR_START_MODE: ${SIMULATOR_START_MODE:-paused} # Options: paused, running
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/v1/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 2s
    networks:
      default:
        aliases:
          - simulator
          - simulator-api

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: fuel-backend
    environment:
      SIMULATOR_BASE_URL: http://simulator:8000
      PORT: 8001
      APP_ENV: production
      LOG_LEVEL: INFO
      POLL_INTERVAL_SECONDS: 1.0
    ports:
      - "8001:8001"
    depends_on:
      simulator:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 3s

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: fuel-dashboard
    environment:
      BACKEND_API_URL: http://backend:8001
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8501/_stcore/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_BACKEND_API_URL: ${VITE_BACKEND_API_URL:-http://localhost:8001}
    container_name: fuel-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
